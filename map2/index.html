<!DOCTYPE html>
<html lang="en" ng-app="app">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@0.7.7/dist/leaflet.css" />
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.3.15/angular.min.js"></script>
  <script src="https://unpkg.com/leaflet@0.7.7/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-leaflet-directive/0.10.0/angular-leaflet-directive.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; }
    .angular-leaflet-map { width: 100%; height: 100vh; }
  </style>
</head>
<body ng-controller="GermanMapCtrl">
  <leaflet center="center" events="events" legend="legend" defaults="defaults" geojson="geojson"></leaflet>
  <script src="./script.js"></script>
</body>
</html>
